services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yinne
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - yinne_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yinne"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  yinne_postgres:
